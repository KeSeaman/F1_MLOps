[package]
name = "f1_sim"
version = "0.2.0"
edition = "2021"

[lib]
name = "_sim"
crate-type = ["cdylib"]

[dependencies]
# abi3: one build runs on CPython 3.12 and later.
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
